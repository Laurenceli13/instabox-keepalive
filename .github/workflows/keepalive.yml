name: instabox-keepalive

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instabox-keepalive
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Open a short SSH session on all four machines
        env:
          INSTABOX_SSH_USER: ${{ secrets.INSTABOX_SSH_USER }}
          INSTABOX_SSH_USER_2: ${{ secrets.INSTABOX_SSH_USER_2 }}
          INSTABOX_SSH_USER_KJDM: ${{ secrets.INSTABOX_SSH_USER_KJDM }}
          INSTABOX_SSH_USER_MXPL: ${{ secrets.INSTABOX_SSH_USER_MXPL }}
        run: |
          set -euo pipefail

          # Only keep the machine awake during these Asia/Shanghai windows:
          # 00:35-07:50, 08:30-13:00, 13:35-18:00, 18:35-23:59
          now=$((10#$(TZ=Asia/Shanghai date +%H%M)))
          if ! (( (now >= 35 && now <= 750) || (now >= 830 && now <= 1300) || (now >= 1335 && now <= 1800) || (now >= 1835 && now <= 2359) )); then
            echo "Outside keepalive window; leaving Instabox idle"
            exit 0
          fi

          if [ -z "${INSTABOX_SSH_USER:-}" ] || \
             [ -z "${INSTABOX_SSH_USER_2:-}" ] || \
             [ -z "${INSTABOX_SSH_USER_KJDM:-}" ] || \
             [ -z "${INSTABOX_SSH_USER_MXPL:-}" ]; then
            echo "::error::All four Instabox SSH token secrets are required"
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # keyscan can fail transiently while Instabox rotates gateway IPs.
          # Do not let that abort the run before the SSH retry loop.
          ssh-keyscan -p 2222 ssh.instabox.sh >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          failed=0
          for user in \
            "${INSTABOX_SSH_USER}" \
            "${INSTABOX_SSH_USER_2}" \
            "${INSTABOX_SSH_USER_KJDM}" \
            "${INSTABOX_SSH_USER_MXPL}"; do
            connected=0
            for attempt in 1 2 3; do
              echo "Attempt ${attempt}/3"
              if ssh \
                -p 2222 \
                -o BatchMode=yes \
                -o StrictHostKeyChecking=accept-new \
                -o ConnectTimeout=30 \
                -o ServerAliveInterval=10 \
                -o ServerAliveCountMax=3 \
                -o PreferredAuthentications=none \
                -o PubkeyAuthentication=no \
                -o PasswordAuthentication=no \
                -o KbdInteractiveAuthentication=no \
                "${user}@ssh.instabox.sh" \
                'echo "connected: $(hostname)"; date -u; uptime; sleep 10; echo done'; then
                connected=1
                break
              fi
              sleep 15
            done
            if [ "$connected" -ne 1 ]; then
              echo "::error::Could not reach an Instabox machine"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "::notice::All four Instabox sessions completed"
