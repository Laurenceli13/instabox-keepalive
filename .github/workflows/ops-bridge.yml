name: instabox-ops-bridge

on:
  workflow_dispatch:
    inputs:
      command_b64:
        description: Base64 encoded shell script
        required: true
        type: string

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Execute selected machine command
        env:
          INSTABOX_SSH_USER_2: ${{ secrets.INSTABOX_SSH_USER_2 }}
          COMMAND_B64: ${{ inputs.command_b64 }}
        run: |
          set -euo pipefail
          test -n "${INSTABOX_SSH_USER_2}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p 2222 ssh.instabox.sh >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts
          printf '%s' "${COMMAND_B64}" | base64 -d > /tmp/ops.sh
          chmod 700 /tmp/ops.sh
          ssh \
            -p 2222 \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            -o PreferredAuthentications=none \
            -o PubkeyAuthentication=no \
            -o PasswordAuthentication=no \
            -o KbdInteractiveAuthentication=no \
            "${INSTABOX_SSH_USER_2}@ssh.instabox.sh" \
            "bash -s" < /tmp/ops.sh
